# 記事のコードがいまも動くかを確かめる（push時と毎週月曜の朝）
name: run
on:
  push:
  schedule:
    - cron: "0 21 * * 0" # 月曜 6:00 JST
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run
        env:
          MPLBACKEND: Agg
        run: for f in *.py; do echo "== $f"; python "$f"; done
